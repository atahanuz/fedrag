[project]
name = "fedrag"
version = "0.1.0"
description = "Agentic RAG over a mixed-format Federal Reserve collection (PDF, web, Word, Excel, CSV) with SQL, web search and live market-data agents"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Atahan Uz"}]
requires-python = ">=3.11"
keywords = ["rag", "agentic-rag", "multi-agent", "llm", "text-to-sql", "hybrid-search", "vllm", "federal-reserve"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pymupdf>=1.28,<1.29",  # pinned: text grouping differs across versions and the index depends on it
    "openai>=1.50",
    "httpx>=0.27",
    "pydantic>=2.5",
    "rich>=13.7",
    "snowballstemmer>=2.2",
    "ddgs>=9.0",
    "trafilatura>=1.12",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pandas>=2.0",
    "yfinance>=0.2.40",
    "python-docx>=1.1",   # Word documents
    "openpyxl>=3.1",      # Excel .xlsx
    "xlrd>=2.0",          # Excel .xls
    "duckdb>=1.1",        # SQL over the extracted tables
]

[project.optional-dependencies]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]  # the pipeline explorer (fedrag ui)
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
fedrag = "fedrag.cli:main"

[project.urls]
Repository = "https://github.com/atahanuz/fedrag"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fedrag*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]  # pyflakes and the basic pycodestyle errors
